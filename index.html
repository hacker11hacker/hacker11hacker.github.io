<style>
:root {
  --bg: #06080f;
  --bg-2: #0b0f1c;
  --surface: rgba(16, 22, 40, 0.74);
  --surface-2: rgba(34, 46, 84, 0.42);
  --text: #EEF2FF;
  --text-muted: #8D9BC6;
  --border: rgba(120, 150, 255, 0.2);
  --accent: #00F0FF;
  --accent-deep: #7C5CFF;
  --accent-soft: rgba(0, 240, 255, 0.11);
  --accent-2: #FF2E93;
  --accent-3: #B6FF3B;
  --success: #3DFFA2;
  --danger: #FF5C7A;
  --on-accent: #03060d;
  --shadow: 0 0 0 1px rgba(120,150,255,0.07), 0 24px 60px rgba(0,0,0,0.55);
  --glow: 0 0 28px rgba(0, 240, 255, 0.32);
  --rain-opacity: 0.5;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --font-display: "IBM Plex Sans Hebrew", "Heebo", system-ui, sans-serif;
  --font-body: "Heebo", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: #F2F4FF;
  --bg-2: #E8ECFF;
  --surface: rgba(255, 255, 255, 0.85);
  --surface-2: rgba(205, 216, 255, 0.45);
  --text: #0C1030;
  --text-muted: #525D88;
  --border: rgba(60, 80, 200, 0.2);
  --accent: #2442FF;
  --accent-deep: #7A22FF;
  --accent-soft: rgba(36, 66, 255, 0.09);
  --accent-2: #E0147A;
  --accent-3: #2A8F00;
  --success: #0F9E63;
  --on-accent: #ffffff;
  --shadow: 0 0 0 1px rgba(60,80,200,0.06), 0 24px 60px rgba(30,40,120,0.14);
  --glow: 0 0 28px rgba(36, 66, 255, 0.22);
  --rain-opacity: 0.16;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background 0.4s ease, color 0.4s ease;
}
a { color: inherit; }
::selection { background: var(--accent); color: var(--on-accent); }

/* ===== Background layers ===== */
#matrix { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -4; opacity: var(--rain-opacity); pointer-events: none; }
.bg-aurora {
  position: fixed; inset: 0; z-index: -3; pointer-events: none;
  background:
    radial-gradient(55vw 50vh at 90% -5%, color-mix(in srgb, var(--accent-deep) 34%, transparent), transparent 70%),
    radial-gradient(45vw 45vh at 0% 45%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
    radial-gradient(45vw 40vh at 75% 105%, color-mix(in srgb, var(--accent-2) 15%, transparent), transparent 70%);
  animation: aurora 20s ease-in-out infinite alternate;
}
@keyframes aurora { to { transform: translate3d(-2%, 2%, 0) scale(1.06); } }
.bg-grid {
  position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 64px 64px;
  opacity: 0.22;
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 20%, transparent 75%);
  mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 20%, transparent 75%);
}
.grain {
  position: fixed; inset: -50%; z-index: 60; pointer-events: none; opacity: 0.05;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
[data-theme="light"] .grain { opacity: 0.035; }
.cursor-glow {
  position: fixed; top: 0; left: 0; width: 460px; height: 460px; margin: -230px 0 0 -230px;
  border-radius: 50%; z-index: -1; pointer-events: none;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 20%, transparent), transparent 65%);
  transform: translate3d(-999px, -999px, 0); will-change: transform;
}
.progress {
  position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 100;
  transform-origin: right; transform: scaleX(0);
  background: linear-gradient(90deg, var(--accent), var(--accent-deep), var(--accent-2));
  box-shadow: 0 0 12px var(--accent);
}

/* ===== Common ===== */
.eyebrow {
  font-family: var(--font-mono); direction: ltr; unicode-bidi: isolate; text-align: end;
  font-size: 0.8rem; letter-spacing: 0.08em; color: var(--accent); margin: 0 0 0.6rem;
}
.section-inner { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
.section-title {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(2rem, 4vw, 3rem); line-height: 1.15; margin: 0;
  background: linear-gradient(90deg, var(--text) 30%, var(--accent));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.reveal { opacity: 0; transform: translateY(32px); transition: opacity 0.8s cubic-bezier(.2,.8,.2,1), transform 0.8s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0ms); }
.reveal.in { opacity: 1; transform: none; }

/* ===== Header ===== */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--bg) 62%, transparent);
  backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid var(--border);
}
.topbar-inner { max-width: 1160px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-mono); font-weight: 600; font-size: 1.05rem; direction: ltr; }
.brand-mark { color: var(--accent); text-shadow: 0 0 12px var(--accent); display: inline-block; animation: spinSlow 9s linear infinite; }
@keyframes spinSlow { to { transform: rotate(360deg); } }
.brand-logo { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; display: none; box-shadow: var(--glow); }
.brand-name::after { content: "_"; color: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.nav { display: flex; gap: 22px; }
.nav a { text-decoration: none; color: var(--text-muted); font-weight: 500; font-size: 0.95rem; position: relative; transition: color 0.2s ease; }
.nav a::after { content: ""; position: absolute; inset-inline: 0; bottom: -4px; height: 2px; background: var(--accent); transform: scaleX(0); transition: transform 0.25s ease; box-shadow: 0 0 8px var(--accent); }
.nav a:hover { color: var(--accent); }
.nav a:hover::after { transform: scaleX(1); }
.theme-toggle { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; color: var(--text); transition: border-color .2s, transform .15s, box-shadow .2s; }
.theme-toggle:hover { border-color: var(--accent); box-shadow: var(--glow); }
.theme-toggle:active { transform: scale(0.9) rotate(20deg); }
.theme-toggle .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.icon-sun { display: none; }
[data-theme="light"] .icon-moon { display: none; }
[data-theme="light"] .icon-sun { display: block; }

/* ===== Hero ===== */
.hero { padding: 72px 24px 56px; position: relative; }
.hero-inner { max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; align-items: center; }
.hero-text { min-width: 0; }
.hero-logo { width: 64px; height: 64px; border-radius: var(--radius-md); object-fit: cover; margin-bottom: 20px; box-shadow: var(--glow); display: none; }


.hero-title { font-family: var(--font-display); font-weight: 700; margin: 0 0 18px; line-height: 1; }
.hero-kicker { display: block; font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
.glitch {
  position: relative; display: inline-block; max-width: 100%;
  font-family: var(--font-mono); font-weight: 600;
  font-size: clamp(2.6rem, 8.5vw, 6.2rem); line-height: 1.05; letter-spacing: -0.03em;
  direction: ltr; unicode-bidi: isolate; white-space: nowrap; word-spacing: -0.22em;
  background: linear-gradient(100deg, var(--accent), var(--accent-deep) 45%, var(--accent-2) 80%, var(--accent));
  background-size: 220% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shine 7s linear infinite;
}
@keyframes shine { to { background-position: 220% center; } }
.glitch::before, .glitch::after { content: attr(data-text); position: absolute; inset: 0; background: none; -webkit-background-clip: initial; background-clip: initial; opacity: 0; pointer-events: none; }
.glitch::before { color: var(--accent-2); animation: glitchA 5s infinite steps(1); }
.glitch::after  { color: var(--accent);   animation: glitchB 5s infinite steps(1); }
@keyframes glitchA { 0%,93%,100% { opacity:0; transform:none; } 94% { opacity:1; transform:translate(-5px,1px); clip-path:inset(10% 0 58% 0);} 96% { opacity:1; transform:translate(5px,-2px); clip-path:inset(62% 0 8% 0);} 98% { opacity:1; transform:translate(-3px,2px); clip-path:inset(32% 0 36% 0);} }
@keyframes glitchB { 0%,93%,100% { opacity:0; transform:none; } 95% { opacity:1; transform:translate(5px,1px); clip-path:inset(46% 0 20% 0);} 97% { opacity:1; transform:translate(-5px,-1px); clip-path:inset(5% 0 72% 0);} 99% { opacity:1; transform:translate(3px,2px); clip-path:inset(72% 0 5% 0);} }

.hero-subtitle { color: var(--text-muted); font-size: 1.25rem; max-width: 46ch; margin: 12px 0 30px; min-height: 2em; }
.hero-subtitle .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--accent); vertical-align: -3px; margin-inline-start: 3px; animation: blink 0.9s steps(1) infinite; }
.hero-subtitle .emoji-img { vertical-align: -9px; width: 30px; height: 30px; margin-inline-start: 6px; }
.hero-actions { display: flex; gap: 14px; flex-wrap: wrap; }

.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 26px; border-radius: 999px; font-weight: 600; font-size: 0.95rem; text-decoration: none; border: 1px solid transparent; cursor: pointer; font-family: var(--font-body); transition: transform .15s, box-shadow .25s, border-color .2s; }
.btn:active { transform: scale(0.96); }
.btn-primary { background: linear-gradient(110deg, var(--accent), var(--accent-deep)); color: var(--on-accent); box-shadow: var(--glow); }
.btn-primary:hover { box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 60%, transparent); transform: translateY(-2px); }

/* ===== Terminal ===== */
.dash-card {
  position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); overflow: hidden; min-width: 0;
}
.dash-card::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; z-index: 5; pointer-events: none;
  background: conic-gradient(from var(--ang, 0deg), transparent 0 72%, var(--accent) 86%, var(--accent-2) 95%, transparent);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: rotateBorder 6s linear infinite;
}
@property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@keyframes rotateBorder { to { --ang: 360deg; } }
.term-bar { display: flex; align-items: center; gap: 7px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); direction: ltr; }
.term-dot { width: 11px; height: 11px; border-radius: 50%; }
.term-dot:nth-child(1) { background: #FF5F57; } .term-dot:nth-child(2) { background: #FEBC2E; } .term-dot:nth-child(3) { background: #28C840; }
.term-title { margin-inline-start: 10px; font-family: var(--font-mono); font-size: 0.74rem; color: var(--text-muted); }
.term-body {
  direction: ltr; text-align: left; padding: 16px 18px 8px; font-family: var(--font-mono); font-size: 0.84rem; line-height: 1.75;
  height: 230px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; cursor: text;
}
.term-line { white-space: pre-wrap; word-break: break-word; }
.term-prompt { color: var(--accent-3); }
.term-out { color: var(--text-muted); }
.term-out b { color: var(--accent); font-weight: 500; }
.term-out a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.term-err { color: var(--danger); }
.term-input-row { display: flex; gap: 8px; align-items: center; direction: ltr; padding: 0 18px 14px; font-family: var(--font-mono); font-size: 0.84rem; }
.term-input {
  flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text);
  font: inherit; caret-color: var(--accent); direction: ltr; text-align: left; padding: 4px 0;
}
.term-input::placeholder { color: var(--text-muted); opacity: 0.55; }
.term-input:focus-visible { outline: none; }
.term-input-row { border-top: 1px solid transparent; transition: border-color .2s; }
.term-input-row:focus-within { border-top-color: var(--accent); }
.term-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 14px; direction: ltr; }
.chip { font-family: var(--font-mono); font-size: 0.72rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--accent-soft); color: var(--accent); cursor: pointer; transition: transform .15s, box-shadow .2s; }
.chip:hover { transform: translateY(-2px); box-shadow: var(--glow); }

.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 18px 18px; border-top: 1px solid var(--border); }
.dash-tile { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; transition: transform .25s, border-color .25s, box-shadow .25s; }
.dash-tile:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--glow); }
.dash-tile-wide { grid-column: span 2; }
.dash-label { font-size: 0.76rem; color: var(--text-muted); }
.dash-value { font-family: var(--font-mono); font-weight: 600; font-size: 1.5rem; color: var(--accent); text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 50%, transparent); direction: ltr; unicode-bidi: isolate; }
.dash-icons { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 6px; }
.dash-icon { width: 38px; height: 38px; border-radius: 10px; overflow: hidden; background: var(--accent-soft); border: 1px solid var(--border); color: var(--accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; flex-shrink: 0; transition: transform .2s, box-shadow .2s; }
.dash-icon:hover { transform: translateY(-4px) rotate(-6deg) scale(1.1); box-shadow: var(--glow); }
.dash-icon img { width: 100%; height: 100%; object-fit: contain; }
.dash-icons-empty { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); }

/* ===== Marquee ===== */
.marquee-wrap { overflow: hidden; padding: 28px 0; }
.marquee {
  border-block: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 55%, transparent);
  overflow: hidden; direction: ltr; padding: 13px 0; transform: rotate(-1.2deg); margin: 0 -20px;
}
.marquee-track { display: flex; width: max-content; animation: marquee 34s linear infinite; }
.marquee:hover .marquee-track { animation-play-state: paused; }
.marquee-item { font-family: var(--font-mono); font-weight: 600; font-size: 1.02rem; padding: 0 24px; white-space: nowrap; color: var(--text-muted); transition: color .2s; }
.marquee-item:hover { color: var(--accent); text-shadow: 0 0 12px var(--accent); }
.marquee-item::after { content: "✦"; margin-inline-start: 48px; color: var(--accent-2); }
@keyframes marquee { to { transform: translateX(-50%); } }

/* ===== Projects (bento) ===== */
.projects { padding: 70px 24px 120px; }
.projects-heading { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 32px; }
.projects-count-badge { font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent); border: 1px solid var(--border); background: var(--accent-soft); padding: 6px 14px; border-radius: 999px; }
.projects-status { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 28px 24px; border: 1px dashed var(--border); border-radius: var(--radius-md); color: var(--text-muted); background: var(--surface); }
.projects-status[hidden] { display: none; }
.projects-status.is-error { border-color: var(--danger); color: var(--danger); }
.status-title { font-weight: 700; color: var(--text); }
.projects-status.is-error .status-title { color: var(--danger); }
.status-code { font-family: var(--font-mono); font-size: 0.85rem; direction: ltr; unicode-bidi: isolate; background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; width: 100%; overflow-x: auto; white-space: pre-wrap; }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; box-shadow: var(--glow); }
@keyframes spin { to { transform: rotate(360deg); } }

.projects-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 22px; align-items: start; perspective: 1400px; }
.project-card { grid-column: span var(--span, 4); }
.project-card {
  --mx: 50%; --my: 50%;
  position: relative; display: flex; flex-direction: column; min-width: 0;
  border-radius: var(--radius-lg); overflow: hidden; background: var(--surface);
  border: 1px solid var(--border); box-shadow: var(--shadow); isolation: isolate;
  transition: transform .25s ease-out, box-shadow .3s ease, border-color .3s ease, opacity .8s cubic-bezier(.2,.8,.2,1);
  will-change: transform;
}
.project-card::before {
  content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background: radial-gradient(300px circle at var(--mx) var(--my), color-mix(in srgb, var(--accent) 20%, transparent), transparent 60%);
  opacity: 0; transition: opacity .3s ease;
}
.project-card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 48px color-mix(in srgb, var(--accent) 26%, transparent), var(--shadow); }
.project-card:hover::before { opacity: 1; }
.project-card:hover .project-arrow { transform: translateX(-6px); }

.project-media {
  position: relative; overflow: hidden;
  background:
    repeating-linear-gradient(135deg, transparent 0 14px, color-mix(in srgb, var(--accent) 7%, transparent) 14px 15px),
    linear-gradient(155deg, var(--surface-2), var(--accent-soft));
}
.project-media.no-image { aspect-ratio: 16 / 10; }
.project-media img { display: block; width: 100%; height: auto; }
.project-media::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(4,6,14,0.78), transparent 58%); }
.project-media:not(.no-image) .fallback { display: none; }
.project-media .fallback { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 4.2rem; color: var(--accent); opacity: 0.55; text-shadow: 0 0 28px var(--accent); }

.project-index { position: absolute; top: 16px; inset-inline-start: 16px; z-index: 2; width: 9px; height: 9px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-2) 25%, transparent), 0 0 14px var(--accent-2); animation: pulse2 2.4s ease-in-out infinite; }
@keyframes pulse2 { 50% { box-shadow: 0 0 0 8px transparent, 0 0 18px var(--accent-2); } }
.project-num { position: absolute; top: 10px; inset-inline-end: 16px; z-index: 2; font-family: var(--font-mono); font-weight: 600; font-size: 1.1rem; color: #fff; opacity: 0.8; direction: ltr; text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
.project-overlay-title { position: absolute; bottom: 16px; inset-inline-start: 16px; inset-inline-end: 16px; z-index: 2; }
.project-overlay-title h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; line-height: 1.5; margin: 0; background: var(--accent); color: var(--on-accent); padding: 2px 16px; border-radius: 999px; display: inline-block; max-width: 100%; box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 50%, transparent); }

.project-body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.project-desc { color: var(--text-muted); font-size: 0.95rem; margin: 0; flex: 1; line-height: 1.65; overflow-wrap: break-word; }
.project-link { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-weight: 600; font-size: 0.95rem; text-decoration: none; font-family: var(--font-display); }
.project-link .project-arrow { display: inline-flex; transition: transform .25s ease; font-size: 1.1rem; }
.project-link::after { content: ""; position: absolute; inset: 0; z-index: 4; }
.project-link-underline { position: relative; padding-bottom: 2px; background-image: linear-gradient(var(--accent), var(--accent)); background-size: 0% 1.5px; background-repeat: no-repeat; background-position: 100% 100%; transition: background-size .25s ease; }
.project-card:hover .project-link-underline { background-size: 100% 1.5px; }

/* ===== Footer ===== */
.footer { border-top: 1px solid var(--border); padding: 36px 24px 28px; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(8px); }
.profiles-row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 18px; margin: 0; }
.profile-btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: var(--text); transition: transform .2s, filter .2s; }
.profile-btn:hover { transform: translateY(-5px) scale(1.12) rotate(-4deg); filter: drop-shadow(0 0 12px var(--accent)); }
.profile-btn img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; display: block; border: 1px solid var(--border); }
.profile-btn span { display: grid; place-items: center; overflow: hidden; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--border); background: var(--accent-soft); font-family: var(--font-mono); }
.footer-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; font-size: 0.85rem; color: var(--text-muted); }
.footer-copy { white-space: nowrap; font-family: var(--font-mono); direction: ltr; }

/* ===== Toast + particles ===== */
.toast {
  position: fixed; bottom: 24px; left: 50%; z-index: 200;
  transform: translate(-50%, 24px); opacity: 0; visibility: hidden; pointer-events: none;
  background: var(--surface); color: var(--accent); border: 1px solid var(--accent); box-shadow: var(--glow);
  backdrop-filter: blur(12px); padding: 12px 22px; border-radius: 999px;
  font-family: var(--font-mono); font-size: 0.85rem; direction: ltr; max-width: calc(100vw - 32px);
  transition: transform .45s cubic-bezier(.2,.9,.3,1.2), opacity .3s ease, visibility 0s linear .45s;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; transition-delay: 0s; }
.particle { position: fixed; z-index: 150; pointer-events: none; font-family: var(--font-mono); font-weight: 700; will-change: transform, opacity; }

/* ===== Responsive ===== */
@media (max-width: 960px) {
  .hero-inner { grid-template-columns: 1fr; gap: 36px; }
  .projects-grid { grid-template-columns: repeat(6, 1fr); }
  .project-card { grid-column: span 3; }
  .project-card.is-wide { grid-column: span 6; }
  .project-card:last-child:nth-child(odd) { grid-column: span 6; }
}
@media (max-width: 640px) {
  .topbar-inner { padding: 12px 16px; }
  .hero { padding: 44px 16px 36px; }
  .section-inner { padding: 0 16px; }
  .projects { padding: 56px 16px 90px; }
  .projects-grid { grid-template-columns: 1fr; gap: 18px; }
  .project-card, .project-card.is-wide, .project-card:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .term-body { height: 210px; }
  .marquee { transform: none; margin: 0; }
}
@media (hover: none) { .cursor-glow { display: none; } }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>

<canvas id="matrix" aria-hidden="true"></canvas>
<div class="bg-aurora" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>
<div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="progress" id="progress" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<header class="topbar">
  <div class="topbar-inner">
    <a href="#home" class="brand">
      <span class="brand-mark" id="brand-mark" aria-hidden="true">◆</span>
      <img class="brand-logo" id="brand-logo" alt="">
      <span class="brand-name" data-slot="site-name">the hacker</span>
    </a>
    <nav class="nav"><a href="#projects">פרויקטים</a></nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="החלף מצב תצוגה בהיר/כהה">
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg>
    </button>
  </div>
</header>

<main>
  <section class="hero" id="home">
    <div class="hero-inner">
      <div class="hero-text">
        <img class="hero-logo" id="hero-logo" alt="">
        <h1 class="hero-title">
          <span class="hero-kicker">נעים להכיר:</span>
          <span class="glitch" id="glitch-name" data-text="the hacker"><span data-slot="site-name-hero">the hacker</span></span>
        </h1>
        <p class="hero-subtitle"><span id="typed-sub"></span><img src="https://fonts.gstatic.com/s/e/notoemoji/17.0/1f60f/32.png" alt="smirk emoji" class="emoji-img" onerror="this.style.display='none'"><span class="caret" aria-hidden="true"></span></p>
        <div class="hero-actions">
          <a href="#projects" class="btn btn-primary">לצפייה בפרויקטים ↓</a>
        </div>
      </div>

      <div class="dash-card" id="dash-card" aria-label="טרמינל ולוח מצב">
        <div class="term-bar">
          <span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span>
          <span class="term-title">~/the-hacker — zsh · נסו להקליד help</span>
        </div>
        <div class="term-body" id="term-body"></div>
        <form class="term-input-row" id="term-form" autocomplete="off">
          <span class="term-prompt">➜ ~</span>
          <input class="term-input" id="term-input" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="שורת פקודה" placeholder="type a command…">
        </form>
        <div class="term-chips" id="term-chips">
          <button type="button" class="chip" data-cmd="help">help</button>
          <button type="button" class="chip" data-cmd="projects">projects</button>
          <button type="button" class="chip" data-cmd="whoami">whoami</button>
          <button type="button" class="chip" data-cmd="matrix">matrix</button>
        </div>
        <div class="dash-grid">
          <div class="dash-tile"><span class="dash-label">זמן בעמוד</span><span class="dash-value" id="uptime">00:00</span></div>
          <div class="dash-tile"><span class="dash-label">כניסות שלך לעמוד</span><span class="dash-value" id="visit-count">-</span></div>
          <div class="dash-tile dash-tile-wide"><span class="dash-label">פרויקטים</span><div class="dash-icons" id="dash-icons"><span class="dash-icons-empty">…</span></div></div>

  <div class="marquee-wrap" aria-hidden="true"><div class="marquee"><div class="marquee-track" id="marquee-track"></div></div></div>

  <section class="projects" id="projects">
    <div class="section-inner">
      <div class="projects-heading reveal">
        <div><p class="eyebrow">// פרויקטים</p><h2 class="section-title">פרויקטים</h2></div>
        <span class="projects-count-badge" id="projects-count-badge" hidden></span>
      </div>
      <div id="projects-status" class="projects-status" hidden></div>
      <div id="projects-grid" class="projects-grid"></div>
    </div>

</main>

<footer class="footer">
  <div class="section-inner footer-inner">
    <span class="footer-copy">© <span id="year"></span> <span data-slot="site-name-footer">the hacker</span></span>
    <div class="profiles-row" id="profiles-row" hidden></div>
  </div>
</footer>

<script src="config.js"></script>
<script>
(() => {
  "use strict";

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  const state = { projects: [] };
  let rainSpeed = 1;

  const safeGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const sleep = (ms) => new Promise((r) => setTimeout(r, reduceMotion ? 0 : ms));

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function safeUrl(u) {
    let v = String(u || "").trim();
    if (!v) return "";
    if (/^(javascript|data|vbscript|file):/i.test(v)) return "";
    if (/^(https?:|mailto:|tel:|sms:|\/|#)/i.test(v)) return v;
    if (/^[a-z][a-z0-9+.-]*:/i.test(v)) return v;   // other schemes (tg:, whatsapp:, …)
    return "https://" + v.replace(/^\/\//, "");     // bare domain like wa.me/123
  }

  /* ---------- identity ---------- */
  function applySiteIdentity() {
    const name = CONFIG.siteName || "the hacker";
    document.querySelectorAll("[data-slot='site-name'], [data-slot='site-name-hero'], [data-slot='site-name-footer']").forEach((el) => { el.textContent = name; });
    const g = document.getElementById("glitch-name"); if (g) g.setAttribute("data-text", name);
    const titleEl = document.querySelector("[data-slot='page-title']");
    if (titleEl) titleEl.textContent = `${name} - ${CONFIG.siteTagline || ""}`.trim();
    const yearEl = document.getElementById("year"); if (yearEl) yearEl.textContent = new Date().getFullYear();

    const logoUrl = (CONFIG.logoUrl || "").trim();
    const favicon = document.getElementById("favicon");
    if (logoUrl) {
      if (favicon) favicon.setAttribute("href", logoUrl);
      const bl = document.getElementById("brand-logo"), bm = document.getElementById("brand-mark"), hl = document.getElementById("hero-logo");
      if (bl) { bl.src = logoUrl; bl.style.display = "block"; }
      if (bm) bm.style.display = "none";
      if (hl) { hl.src = logoUrl; hl.style.display = "block"; }
    } else if (favicon) {
      const letter = name.trim().charAt(0).toUpperCase();
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%2306080f"/><rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="%2300F0FF" stroke-width="3"/><text x="32" y="43" font-family="monospace" font-size="32" font-weight="700" fill="%2300F0FF" text-anchor="middle">${letter}</text></svg>`;
      favicon.setAttribute("href", `data:image/svg+xml,${svg}`);
    }
  }

  /* ---------- theme ---------- */
  function setTheme(mode, announce) {
    const root = document.documentElement;
    if (mode === "light") root.setAttribute("data-theme", "light"); else root.removeAttribute("data-theme");
    safeSet("theme-v2", mode);
    if (announce) toast(mode === "light" ? "> mode: light (are you ok?)" : "> mode: dark ✓");
  }
  function currentTheme() { return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark"; }
  function initTheme() {
    setTheme(safeGet("theme-v2") || "dark", false);
    document.getElementById("theme-toggle").addEventListener("click", () => setTheme(currentTheme() === "light" ? "dark" : "light", true));
  }

  /* ---------- toast ---------- */
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById("toast"); if (!el) return;
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
  }

  /* ---------- matrix rain ---------- */
  function initMatrix() {
    const canvas = document.getElementById("matrix"); if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const chars = "01אבגדהוזחטיכלמנסעפצקרשת{}[]<>/\\;=+*#$%&ABCDEF".split("");
    const size = 16; let cols, drops, w, h;
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cols = Math.ceil(w / size); drops = Array.from({ length: cols }, () => Math.random() * -50);
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h);
    }
    resize(); window.addEventListener("resize", resize);
    if (reduceMotion) return;
    let last = 0;
    (function frame(t) {
      requestAnimationFrame(frame);
      if (document.hidden || t - last < 50 / rainSpeed) return;
      last = t;
      const light = currentTheme() === "light";
      ctx.fillStyle = light ? "rgba(242,244,255,0.14)" : "rgba(6,8,15,0.13)";
      ctx.fillRect(0, 0, w, h);
      ctx.font = `${size}px "IBM Plex Mono", monospace`;
      const c1 = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#00F0FF";
      for (let i = 0; i < cols; i += 1) {
        const y = drops[i] * size;
        ctx.fillStyle = Math.random() > 0.975 ? "#ffffff" : c1;
        ctx.fillText(chars[(Math.random() * chars.length) | 0], i * size, y);
        if (y > h && Math.random() > 0.975) drops[i] = 0;
        drops[i] += 1;
      }
    })(0);
  }

  /* ---------- typing ---------- */
  function typeInto(el, text, speed = 45) {
    return new Promise((resolve) => {
      if (!el) return resolve();
      if (reduceMotion) { el.textContent = text; return resolve(); }
      let i = 0;
      const id = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) { clearInterval(id); resolve(); } }, speed);
    });
  }
  async function initHeroTyping() {
    await typeInto(document.getElementById("typed-sub"), "נושם קוד ומחפש עוד באג לתקן", 55);
  }

  /* ---------- interactive terminal ---------- */
  const term = { body: null, input: null, history: [], hi: -1 };
  function termPrint(html, cls = "term-out") {
    const d = document.createElement("div"); d.className = `term-line ${cls}`; d.innerHTML = html;
    term.body.appendChild(d); term.body.scrollTop = term.body.scrollHeight; return d;
  }
  function termEcho(cmd) { termPrint(`<span class="term-prompt">➜ ~ </span>${escapeHtml(cmd)}`, "term-line"); }

  const COMMANDS = {
    help() {
      return [
        "<b>help</b>        הצגת הפקודות",
        "<b>whoami</b>      מי אני",
        "<b>projects</b>    רשימת הפרויקטים",
        "<b>open N</b>      פתיחת פרויקט לפי מספר",
        "<b>theme</b>       החלפת מצב כהה/בהיר",
        "<b>matrix</b>      האצת הגשם",
        "<b>date</b>        מה השעה",
        "<b>clear</b>       ניקוי המסך",
      ];
    },
    whoami() { return [`<b>${escapeHtml(CONFIG.siteName || "the hacker")}</b>`, "קוד · באגים · קפה · כאוס"]; },
    ls() { return COMMANDS.projects(); },
    projects() {
      if (!state.projects.length) return ["אין פרויקטים (עדיין)…"];
      return state.projects.map((p, i) => `<b>${String(i + 1).padStart(2, "0")}</b>  ${escapeHtml(p.name)}`).concat(["", "הקלידו <b>open N</b> כדי לפתוח"]);
    },
    open(args) {
      const n = parseInt(args[0], 10);
      const p = state.projects[n - 1];
      if (!p) return [{ err: `open: אין פרויקט ${escapeHtml(args[0] || "")}` }];
      const url = safeUrl(p.link);
      if (!url) return [`<b>${escapeHtml(p.name)}</b> — אין קישור`];
      setTimeout(() => window.open(url, "_blank", "noopener"), 250);
      return [`פותח את <b>${escapeHtml(p.name)}</b>… (אם נחסם: <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">לחצו כאן</a>)`];
    },
    theme() { setTheme(currentTheme() === "light" ? "dark" : "light", false); return [`mode: <b>${currentTheme()}</b>`]; },
    matrix() { rainSpeed = rainSpeed > 1 ? 1 : 4; return [rainSpeed > 1 ? "הגשם הואץ. הקלידו שוב כדי להרגיע." : "חזרה לקצב רגיל."]; },
    date() { return [new Date().toLocaleString("he-IL")]; },
    clear() { term.body.innerHTML = ""; return []; },
    echo(args) { return [escapeHtml(args.join(" "))]; },
    rm(args) { return [{ err: args.join(" ").includes("-rf") ? "rm: ממש לא. 🚫" : "rm: permission denied" }]; },
    exit() { return ["אין יציאה. רק קוד."]; },
  };

  function runCommand(raw) {
    const line = raw.trim(); if (!line) return;
    term.history.push(line); term.hi = term.history.length;
    termEcho(line);
    const [cmd, ...args] = line.split(/\s+/);
    const fn = COMMANDS[cmd.toLowerCase()];
    if (!fn) { termPrint(`zsh: command not found: ${escapeHtml(cmd)} — נסו <b>help</b>`, "term-line term-err"); return; }
    (fn(args) || []).forEach((l) => {
      if (l && l.err) termPrint(l.err, "term-line term-err"); else termPrint(l === "" ? "&nbsp;" : l);
    });
  }

  async function initTerminal() {
    term.body = document.getElementById("term-body");
    term.input = document.getElementById("term-input");
    const form = document.getElementById("term-form");
    if (!term.body) return;

    form.addEventListener("submit", (e) => { e.preventDefault(); const v = term.input.value; term.input.value = ""; runCommand(v); });
    term.input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp") { e.preventDefault(); if (term.hi > 0) { term.hi -= 1; term.input.value = term.history[term.hi]; } }
      else if (e.key === "ArrowDown") { e.preventDefault(); if (term.hi < term.history.length - 1) { term.hi += 1; term.input.value = term.history[term.hi]; } else { term.hi = term.history.length; term.input.value = ""; } }
      e.stopPropagation();
    });
    term.body.addEventListener("click", () => term.input.focus({ preventScroll: true }));
    document.getElementById("term-chips").addEventListener("click", (e) => {
      const b = e.target.closest("[data-cmd]"); if (b) runCommand(b.dataset.cmd);
    });

    const name = CONFIG.siteName || "the hacker";
    const intro = [
      { cmd: "whoami", out: `<b>${escapeHtml(name)}</b>` },
      { cmd: "cat skills.txt", out: "<b>code</b> · <b>bugs</b> · <b>coffee</b> · <b>chaos</b>" },
      { cmd: "ls ./projects | wc -l", out: `<b data-proj-count>…</b> projects found` },
    ];
    for (const s of intro) {
      const line = document.createElement("div"); line.className = "term-line";
      line.innerHTML = `<span class="term-prompt">➜ ~ </span><span class="c"></span>`;
      term.body.appendChild(line);
      await typeInto(line.querySelector(".c"), s.cmd, 50);
      await sleep(200);
      termPrint(s.out); await sleep(250);
    }
    termPrint("הקלידו <b>help</b> או לחצו על אחד הכפתורים למטה ↓");
    if (window.__projCount !== undefined) setTermProjectCount(window.__projCount);
  }
  function setTermProjectCount(n) {
    window.__projCount = n;
    document.querySelectorAll("[data-proj-count]").forEach((el) => { el.textContent = String(n); });
  }

  /* ---------- marquee ---------- */
  function initMarquee() {
    const track = document.getElementById("marquee-track"); if (!track) return;
    const words = ["HTML", "CSS", "JavaScript", "Python", "Linux", "Git", "API", "Debugging", "Open Source", "Terminal", "Bash", "Algorithms", "Cyber", "Hack the planet"];
    const html = words.map((w) => `<span class="marquee-item">${w}</span>`).join("");
    track.innerHTML = html + html;
  }

  /* ---------- dashboard ---------- */
  function initDashboard() {
    const startedAt = Date.now(); const uptimeEl = document.getElementById("uptime");
    if (uptimeEl) {
      const tick = () => { const s = Math.floor((Date.now() - startedAt) / 1000); uptimeEl.textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
      tick(); setInterval(tick, 1000);
    }
    const visitEl = document.getElementById("visit-count");
    if (visitEl) {
      const count = (parseInt(safeGet("pageVisits") || "0", 10) || 0) + 1;
      safeSet("pageVisits", String(count)); visitEl.textContent = String(count);
    }
  }

  /* ---------- effects ---------- */
  let io;
  function observeReveals(root) {
    const els = root.querySelectorAll(".reveal:not(.in)");
    if (!("IntersectionObserver" in window)) { els.forEach((el) => el.classList.add("in")); return; }
    if (!io) io = new IntersectionObserver((entries) => entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: 0.1, rootMargin: "0px 0px -40px 0px" });
    els.forEach((el) => io.observe(el));
  }
  function attachSpotlight(el, tilt = 0) {
    el.addEventListener("mousemove", (e) => {
      const r = el.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      el.style.setProperty("--mx", `${px * 100}%`); el.style.setProperty("--my", `${py * 100}%`);
      if (tilt) el.style.transform = `perspective(1000px) rotateY(${(px - 0.5) * tilt}deg) rotateX(${(0.5 - py) * tilt}deg)`;
    });
    el.addEventListener("mouseleave", () => { el.style.transform = ""; });
  }
  function initEffects() {
    const glow = document.getElementById("cursor-glow"), progress = document.getElementById("progress");
    if (finePointer && glow && !reduceMotion) {
      let gx = 0, gy = 0, tx = 0, ty = 0;
      window.addEventListener("mousemove", (e) => { tx = e.clientX; ty = e.clientY; }, { passive: true });
      (function loop() { gx += (tx - gx) * 0.12; gy += (ty - gy) * 0.12; glow.style.transform = `translate3d(${gx}px, ${gy}px, 0)`; requestAnimationFrame(loop); })();
    }
    const onScroll = () => { const max = document.documentElement.scrollHeight - window.innerHeight; progress.style.transform = `scaleX(${max > 0 ? window.scrollY / max : 0})`; };
    window.addEventListener("scroll", onScroll, { passive: true }); onScroll();
    observeReveals(document);
  }

  /* ---------- particles + easter eggs ---------- */
  function burst(x, y, count = 36) {
    if (reduceMotion) return;
    const glyphs = "01{}<>/;$#&*אבגד".split(""), colors = ["#00F0FF", "#FF2E93", "#B6FF3B", "#7C5CFF", "#ffffff"];
    for (let i = 0; i < count; i += 1) {
      const p = document.createElement("span"); p.className = "particle";
      p.textContent = glyphs[(Math.random() * glyphs.length) | 0];
      p.style.left = `${x}px`; p.style.top = `${y}px`; p.style.color = colors[(Math.random() * colors.length) | 0]; p.style.fontSize = `${14 + Math.random() * 18}px`;
      document.body.appendChild(p);
      const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 220;
      p.animate([{ transform: "translate(0,0) rotate(0) scale(1)", opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d + 120}px) rotate(${Math.random() * 540 - 270}deg) scale(0.4)`, opacity: 0 }], { duration: 900 + Math.random() * 900, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => p.remove();
    }
  }
  function initEasterEggs() {
    const brand = document.querySelector(".brand"); let clicks = 0, ct;
    if (brand) brand.addEventListener("click", () => { clicks += 1; clearTimeout(ct); ct = setTimeout(() => { clicks = 0; }, 900); if (clicks >= 5) { clicks = 0; toast("> you found a secret. respect. ✦"); burst(window.innerWidth / 2, 120, 60); } });
  }

  /* ---------- CSV / gviz ---------- */
  function parseCsv(text) {
    const rows = []; let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i += 1) {
      const char = text[i], next = text[i + 1];
      if (inQuotes) { if (char === '"' && next === '"') { field += '"'; i += 1; } else if (char === '"') inQuotes = false; else field += char; }
      else if (char === '"') inQuotes = true;
      else if (char === ",") { row.push(field); field = ""; }
      else if (char === "\n") { row.push(field); field = ""; rows.push(row); row = []; }
      else if (char === "\r") { /* skip */ }
      else field += char;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.some((c) => c.trim() !== ""));
  }
  const normalizeHeader = (h) => String(h || "").trim().toLowerCase();
  function mapRow(headers, row, aliasMap) {
    const obj = {};
    Object.entries(aliasMap).forEach(([key, aliases]) => {
      const idx = headers.findIndex((h) => aliases.some((a) => normalizeHeader(a) === h));
      obj[key] = idx > -1 ? (row[idx] || "").trim() : "";
    });
    return obj;
  }
  async function fetchWithRetry(url, attempts = 2) {
    let lastErr;
    for (let i = 0; i < attempts; i += 1) {
      try { const res = await fetch(url, { cache: "no-store", redirect: "follow" }); if (!res.ok) throw new Error(`HTTP ${res.status}`); return await res.text(); }
      catch (err) { lastErr = err; if (i < attempts - 1) await new Promise((r) => setTimeout(r, 800)); }
    }
    throw lastErr;
  }
  function buildGvizUrl(spreadsheetId, sheetName) {
    const base = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(spreadsheetId)}/gviz/tq`;
    const params = new URLSearchParams({ tqx: "out:json", headers: "1" });
    if (sheetName) params.set("sheet", sheetName);
    return `${base}?${params.toString()}`;
  }
  function parseGvizJson(text) {
    const start = text.indexOf("{"), end = text.lastIndexOf("}");
    if (start === -1 || end === -1 || end < start) throw new Error("תשובה לא צפויה מהגיליון (gviz)");
    let data; try { data = JSON.parse(text.slice(start, end + 1)); } catch (err) { throw new Error("לא הצלחתי לפענח את תשובת הגיליון (gviz)"); }
    if (data.status === "error") throw new Error((data.errors && data.errors[0] && data.errors[0].detailed_message) || "שגיאה בגיליון");
    const rowToArray = (r) => (r.c || []).map((cell) => { if (!cell) return ""; const val = cell.f !== undefined && cell.f !== null ? cell.f : cell.v; return val === null || val === undefined ? "" : String(val); });
    let cols = (data.table.cols || []).map((c) => (c.label || "").trim());
    const dataRows = (data.table.rows || []).map(rowToArray);
    const looksGeneric = cols.every((c, i) => !c || c === `Col${i + 1}` || /^[A-Z]{1,2}$/.test(c));
    if (looksGeneric && dataRows.length) { cols = dataRows[0]; return [cols, ...dataRows.slice(1)]; }
    return [cols, ...dataRows];
  }
  async function loadSheetRows({ csvUrl, spreadsheetId, sheetName }) {
    const c = (csvUrl || "").trim(), s = (spreadsheetId || "").trim();
    if (c) return parseCsv(await fetchWithRetry(c));
    if (s) return parseGvizJson(await fetchWithRetry(buildGvizUrl(s, sheetName)));
    return null;
  }

  /* ---------- projects ---------- */
  const PROJECT_ALIASES = {
    name: ["שם", "שם הפרויקט", "name", "title"],
    description: ["תיאור", "description", "desc"],
    image: ["תמונה", "image", "img", "תמונה (קישור)"],
    link: ["קישור", "link", "url", "כניסה לפרויקט"],
    buttonText: ["טקסט כפתור", "כפתור", "טקסט", "buttontext", "button", "cta"],
  };
  function showProjectsStatus({ title, code, isError, showSpinner }) {
    const statusEl = document.getElementById("projects-status"), gridEl = document.getElementById("projects-grid");
    gridEl.innerHTML = ""; statusEl.hidden = false; statusEl.classList.toggle("is-error", Boolean(isError));
    statusEl.innerHTML = `${showSpinner ? '<div class="spinner" aria-hidden="true"></div>' : ""}<div class="status-title">${escapeHtml(title)}</div>${code ? `<div class="status-code">${escapeHtml(code)}</div>` : ""}`;
  }
  function updateProjectCount(count) {
    const badgeEl = document.getElementById("projects-count-badge");
    if (badgeEl) { if (count > 0) { badgeEl.hidden = false; badgeEl.textContent = `${count} פרויקטים`; } else badgeEl.hidden = true; }
    setTermProjectCount(count);
  }
  function renderDashIcons(projects) {
    const container = document.getElementById("dash-icons"); if (!container) return;
    if (!projects.length) { container.innerHTML = '<span class="dash-icons-empty">אין עדיין</span>'; return; }
    const cap = 10, shown = projects.slice(0, cap), extra = projects.length - shown.length;
    container.innerHTML = shown.map((p) => {
      const letter = escapeHtml((p.name || "?").trim().charAt(0).toUpperCase());
      return p.image ? `<span class="dash-icon" title="${escapeHtml(p.name)}"><img src="${escapeHtml(p.image)}" alt="" onerror="this.replaceWith(document.createTextNode('${letter}'))"></span>` : `<span class="dash-icon" title="${escapeHtml(p.name)}">${letter}</span>`;
    }).join("") + (extra > 0 ? `<span class="dash-icon">+${extra}</span>` : "");
  }
  // Bento rhythm: card 1 wide, card 2 narrow, then pairs of (narrow, wide) rows of 5+7 / 7+5 / 4+4+4 …
  // Builds row spans that always add up to 12 columns, so the grid never has holes:
  // pairs alternate 7+5 / 5+7, a remainder of 3 becomes 4+4+4, a lone last card is full width.
  function bentoSpans(total) {
    const spans = []; let left = total, flip = false;
    while (left > 0) {
      if (left === 1) { spans.push(12); left -= 1; }
      else if (left === 3) { spans.push(4, 4, 4); left -= 3; }
      else { spans.push(...(flip ? [5, 7] : [7, 5])); flip = !flip; left -= 2; }
    }
    return spans;
  }
  function renderProjects(projects) {
    document.getElementById("projects-status").hidden = true;
    const gridEl = document.getElementById("projects-grid");
    const spans = bentoSpans(projects.length);
    gridEl.innerHTML = projects.map((p, i) => {
      const cta = p.buttonText || "כניסה", num = String(i + 1).padStart(2, "0"), letter = escapeHtml((p.name || "?").trim().charAt(0).toUpperCase());
      const url = safeUrl(p.link);
      return `
      <article class="project-card reveal${spans[i] >= 7 ? " is-wide" : ""}" style="--span:${spans[i]};--d:${Math.min(i, 6) * 80}ms">
        <div class="project-media${p.image ? "" : " no-image"}">
          <span class="fallback" aria-hidden="true">${letter}</span>
          ${p.image ? `<img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="this.parentNode.classList.add('no-image');this.remove()">` : ""}
          <span class="project-index" aria-hidden="true"></span>
          <span class="project-num" aria-hidden="true">#${num}</span>
          <div class="project-overlay-title"><h3>${escapeHtml(p.name || "פרויקט ללא שם")}</h3></div>
        </div>
        <div class="project-body">
          ${p.description ? `<p class="project-desc">${escapeHtml(p.description)}</p>` : ""}
          ${url ? `<a class="project-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer"><span class="project-link-underline">${escapeHtml(cta)}</span><span class="project-arrow" aria-hidden="true">←</span></a>` : ""}
        </div>
      </article>`;
    }).join("");
    updateProjectCount(projects.length); renderDashIcons(projects);
    gridEl.querySelectorAll(".project-card").forEach((card) => { if (finePointer) attachSpotlight(card, reduceMotion ? 0 : 5); });
    observeReveals(gridEl);
  }
  async function loadProjects() {
    const hasCsv = Boolean((CONFIG.sheetCsvUrl || "").trim()), hasId = Boolean((CONFIG.spreadsheetId || "").trim());
    if (!hasCsv && !hasId) {
      showProjectsStatus({ title: "עדיין לא חובר גיליון פרויקטים", code: "פתחו את config.js והגדירו spreadsheetId (מומלץ) או sheetCsvUrl" });
      renderDashIcons([]); setTermProjectCount(0); return;
    }
    showProjectsStatus({ title: "טוען פרויקטים...", showSpinner: true });
    try {
      const rows = await loadSheetRows({ csvUrl: CONFIG.sheetCsvUrl, spreadsheetId: CONFIG.spreadsheetId, sheetName: CONFIG.projectsSheetName });
      if (!rows || rows.length < 2) { showProjectsStatus({ title: "לא נמצאו פרויקטים בגיליון עדיין" }); renderDashIcons([]); setTermProjectCount(0); return; }
      const headers = rows[0].map(normalizeHeader);
      const projects = rows.slice(1).map((r) => { const p = mapRow(headers, r, PROJECT_ALIASES); if (!p.buttonText) p.buttonText = (r[4] || "").trim(); return p; }).filter((p) => p.name);
      if (!projects.length) { showProjectsStatus({ title: "לא נמצאו פרויקטים בגיליון עדיין" }); renderDashIcons([]); setTermProjectCount(0); return; }
      state.projects = projects; renderProjects(projects);
    } catch (err) {
      const msg = String((err && err.message) || err), is307 = msg.includes("307");
      showProjectsStatus({ title: "לא הצלחתי לטעון את הפרויקטים", code: is307 ? "שגיאה 307: הפניה זמנית מגוגל שיטס. חכו כמה דקות אחרי הפרסום ורעננו, או ראו את ההערה ב-config.js לפתרון קבוע." : msg, isError: true });
      renderDashIcons([]); setTermProjectCount(0);
    }
  }

  /* ---------- profiles ---------- */
  const PROFILE_ALIASES = { symbol: ["סמל", "אייקון", "לוגו", "symbol", "icon", "logo"], link: ["קישור", "link", "url"] };
  function domainInitial(url) { try { return new URL(url).hostname.replace(/^www\./, "").charAt(0).toUpperCase() || "•"; } catch (e) { return "•"; } }
  function looksLikeImageUrl(value) { const v = String(value || "").trim(); if (!v) return false; if (/^(https?:\/\/|data:image\/)/i.test(v)) return true; return /\.(png|jpe?g|gif|webp|svg|avif)(\?.*)?$/i.test(v); }
  async function loadProfiles() {
    const hasCsv = Boolean((CONFIG.profilesCsvUrl || "").trim()), hasId = Boolean((CONFIG.spreadsheetId || "").trim());
    const row = document.getElementById("profiles-row"); if ((!hasCsv && !hasId) || !row) return;
    try {
      const rows = await loadSheetRows({ csvUrl: CONFIG.profilesCsvUrl, spreadsheetId: CONFIG.spreadsheetId, sheetName: CONFIG.profilesSheetName });
      if (!rows || rows.length < 2) return;
      const headers = rows[0].map(normalizeHeader);
      const profiles = rows.slice(1).map((r) => { const p = mapRow(headers, r, PROFILE_ALIASES); if (!p.symbol) p.symbol = (r[0] || "").trim(); if (!p.link) p.link = (r[1] || "").trim(); return p; }).filter((p) => safeUrl(p.link));
      if (!profiles.length) return;
      row.innerHTML = profiles.map((p) => `<a class="profile-btn" href="${escapeHtml(safeUrl(p.link))}" target="_blank" rel="noopener noreferrer">${looksLikeImageUrl(p.symbol) ? `<img src="${escapeHtml(p.symbol)}" alt="">` : `<span>${escapeHtml(p.symbol || domainInitial(p.link))}</span>`}</a>`).join("");
      row.hidden = false;
    } catch (err) { console.warn("profiles load failed:", err); }
  }

  /* ---------- init ---------- */
  document.addEventListener("DOMContentLoaded", () => {
    applySiteIdentity(); initTheme(); initMatrix(); initMarquee(); initDashboard(); initEffects(); initEasterEggs();
    initHeroTyping(); initTerminal(); loadProjects(); loadProfiles();
  });
})();
</script>
</body>
</html>
